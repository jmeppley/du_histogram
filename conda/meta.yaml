{% set name = "du_histogram" %}
{% set version = "0.10.0" %}
{% set sha256 = "5fd9d287d6055eb2b75451377d8eddb3a361b41b9d3ac021256f3e371d215707" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jmeppley/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
  entry_points:
    - duhist = du_histogram:main
    - duhist.py = du_histogram:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10

test:
  imports:
    - du_histogram
  requires:
    - pip
  commands:
    - pip check
    - duhist --help
    - duhist --version
    - duhist.py -h
    - duhist
    - duhist -w 90 -W 15
    - duhist -l -t .

about:
  home: https://github.com/jmeppley/{{ name }}
  summary: Simple ASCII histogram of du (disk usage) output
  license: Apache-2.0
  license_file: LICENSE
